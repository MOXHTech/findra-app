<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>findra icon</title>
  <desc>Dark rounded-square badge with a radar sweep converging to a center dot, and three colored spokes representing Windows, macOS, and Linux unifying into one fast search.</desc>
  <defs>
    <radialGradient id="bgVignette" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#151B26"/>
      <stop offset="100%" stop-color="#0B0E14"/>
    </radialGradient>
    <radialGradient id="sweepGrad" cx="100" cy="100" r="62" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFB000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#FFB000" stop-opacity="0.5"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="200" height="200" rx="44" fill="url(#bgVignette)"/>

  <circle cx="100" cy="100" r="62" fill="none" stroke="#FFB000" stroke-opacity="0.14" stroke-width="1.5"/>
  <circle cx="100" cy="100" r="46" fill="none" stroke="#FFB000" stroke-opacity="0.22" stroke-width="1.5"/>
  <circle cx="100" cy="100" r="30" fill="none" stroke="#FFB000" stroke-opacity="0.32" stroke-width="1.5"/>

  <path d="M100,100 L100,38 A62,62 0 0,1 143.84,56.16 Z" fill="url(#sweepGrad)"/>

  <line x1="100" y1="34" x2="100" y2="20" stroke="#4FA8E0" stroke-width="7" stroke-linecap="round"/>
  <circle cx="100" cy="20" r="4.5" fill="#4FA8E0"/>

  <line x1="157.2" y1="133" x2="169.3" y2="140" stroke="#C9CED6" stroke-width="7" stroke-linecap="round"/>
  <circle cx="169.3" cy="140" r="4.5" fill="#C9CED6"/>

  <line x1="42.8" y1="133" x2="30.7" y2="140" stroke="#F2795B" stroke-width="7" stroke-linecap="round"/>
  <circle cx="30.7" cy="140" r="4.5" fill="#F2795B"/>

  <circle cx="100" cy="100" r="14" fill="#FFB000" opacity="0.18"/>
  <circle cx="100" cy="100" r="8" fill="#FFB000"/>
</svg>
