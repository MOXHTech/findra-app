name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.1.0"
        required: true
        type: string
      draft:
        description: "Create the GitHub Release as a draft"
        required: true
        default: true
        type: boolean
      prerelease:
        description: "Mark the GitHub Release as a prerelease"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  RELEASE_DRAFT: ${{ github.event_name == 'workflow_dispatch' && inputs.draft || false }}
  RELEASE_PRERELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}
  FINDRA_REPOSITORY: MOXHTech/findra

jobs:
  publish:
    name: Build and publish macOS binary
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout daemon
        uses: actions/checkout@v4
        with:
          repository: ${{ env.FINDRA_REPOSITORY }}
          ref: ${{ env.RELEASE_TAG }}
          token: ${{ secrets.FINDRA_REPO_TOKEN }}
          path: findra

      - name: Test
        run: swift test

      - name: Package
        run: |
          VERSION="${RELEASE_TAG#v}" OUT_DIR=release FINDRA_REPO="$GITHUB_WORKSPACE/findra" ./scripts/package-local.sh

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            git tag "${RELEASE_TAG}" || true
            git push origin "${RELEASE_TAG}" || true
          fi

          gh release create "${RELEASE_TAG}" \
            --title "Findra ${RELEASE_TAG}" \
            ${{ env.RELEASE_DRAFT == 'true' && '--draft' || '' }} \
            ${{ env.RELEASE_PRERELEASE == 'true' && '--prerelease' || '' }} \
            --generate-notes \
            release/Findra-*-macos-*.dmg \
            release/Findra-*-macos-*.dmg.sha256 \
            release/Findra-*-macos-*.zip \
            release/Findra-*-macos-*.zip.sha256
